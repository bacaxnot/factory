set -g mouse on
set -g history-limit 50000
set -sg escape-time 0
set -g renumber-windows on
set -g default-terminal "tmux-256color"
set -g status-right " #(cswap-status) "
set -g status-right-length 60
set -g default-shell /usr/bin/zsh
# a session takes the git identity of the connection that creates or attaches to it
set -ga update-environment "GIT_AUTHOR_NAME GIT_AUTHOR_EMAIL GIT_COMMITTER_NAME GIT_COMMITTER_EMAIL"
